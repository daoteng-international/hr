name: Create Demo Admin

on:
  workflow_dispatch:

jobs:
  create-demo-admin:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: dd181562-df73-4a1d-b4d6-c9f3e4c07e52
      RAILWAY_SERVICE_ID: b79d9602-745f-46d1-8dfb-cb448feab202
      RAILWAY_ENVIRONMENT: production
      DEMO_LOGIN_EMAIL: demo@daoteng.demo
      DEMO_LOGIN_PASSWORD: "000000"
      DEMO_TENANT_NAME: Demo 展示環境
      API_BASE_URL: https://hr-production-994f.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Create or reset demo admin
        run: |
          set -euo pipefail
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT"
          railway variables --json > /tmp/hr-railway-vars.json
          chmod 600 /tmp/hr-railway-vars.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createClient } from "@supabase/supabase-js";

          const vars = JSON.parse(fs.readFileSync("/tmp/hr-railway-vars.json", "utf8"));
          const supabaseUrl = vars.SUPABASE_URL;
          const serviceRoleKey = vars.SUPABASE_SERVICE_ROLE_KEY;
          const anonKey = vars.SUPABASE_ANON_KEY;
          const apiBaseUrl = process.env.API_BASE_URL;
          const email = process.env.DEMO_LOGIN_EMAIL;
          const password = process.env.DEMO_LOGIN_PASSWORD;
          const tenantName = process.env.DEMO_TENANT_NAME;

          if (!supabaseUrl || !serviceRoleKey || !anonKey) {
            throw new Error("Missing Supabase variables in Railway production service");
          }
          if (!email || !password || !tenantName || !apiBaseUrl) {
            throw new Error("Missing demo account configuration");
          }

          const admin = createClient(supabaseUrl, serviceRoleKey, {
            auth: { persistSession: false },
          });
          const anon = createClient(supabaseUrl, anonKey, {
            auth: { persistSession: false },
          });

          async function findUserByEmail(targetEmail) {
            for (let page = 1; page <= 20; page += 1) {
              const { data, error } = await admin.auth.admin.listUsers({ page, perPage: 100 });
              if (error) throw error;
              const user = data.users.find((candidate) => candidate.email?.toLowerCase() === targetEmail.toLowerCase());
              if (user) return user;
              if (data.users.length < 100) return null;
            }
            return null;
          }

          const { data: existingTenant, error: tenantFindError } = await admin
            .from("tenants")
            .select("id")
            .eq("name", tenantName)
            .maybeSingle();
          if (tenantFindError) throw tenantFindError;

          let tenantId = existingTenant?.id;
          if (!tenantId) {
            const { data: createdTenant, error: tenantCreateError } = await admin
              .from("tenants")
              .insert({
                name: tenantName,
                status: "active",
                branding: { logoUrl: null, primaryColor: "#2563eb", appName: "Demo HR 系統" },
                features: { payroll: true, kpi: true, ai_assistant: true },
              })
              .select("id")
              .single();
            if (tenantCreateError || !createdTenant) throw tenantCreateError ?? new Error("Failed to create demo tenant");
            tenantId = createdTenant.id;
          }

          const existingUser = await findUserByEmail(email);
          let userId = existingUser?.id;
          if (userId) {
            const { error } = await admin.auth.admin.updateUserById(userId, {
              password,
              email_confirm: true,
              app_metadata: { ...(existingUser.app_metadata ?? {}), tenant_id: tenantId },
            });
            if (error) throw error;
          } else {
            const { data, error } = await admin.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
              app_metadata: { tenant_id: tenantId },
            });
            if (error || !data.user) throw error ?? new Error("Failed to create demo user");
            userId = data.user.id;
          }

          const { data: existingEmployee, error: employeeFindError } = await admin
            .from("employees")
            .select("id")
            .eq("tenant_id", tenantId)
            .eq("user_id", userId)
            .maybeSingle();
          if (employeeFindError) throw employeeFindError;

          const employeeRow = {
            tenant_id: tenantId,
            user_id: userId,
            emp_no: "DEMO-ADMIN",
            name: "Demo 管理員",
            role: "hr_admin",
            employment_type: "regular",
            hire_date: "2024-01-01",
            status: "active",
          };

          if (existingEmployee?.id) {
            const { error } = await admin
              .from("employees")
              .update(employeeRow)
              .eq("id", existingEmployee.id)
              .eq("tenant_id", tenantId);
            if (error) throw error;
          } else {
            const { error } = await admin.from("employees").insert(employeeRow);
            if (error) throw error;
          }

          const { data: sessionData, error: signInError } = await anon.auth.signInWithPassword({ email, password });
          if (signInError || !sessionData.session?.access_token) throw signInError ?? new Error("Demo sign-in failed");

          const seedResponse = await fetch(`${apiBaseUrl}/demo/seed`, {
            method: "POST",
            headers: {
              authorization: `Bearer ${sessionData.session.access_token}`,
              "content-type": "application/json",
            },
          });
          const seedBody = await seedResponse.json().catch(() => ({}));
          if (!seedResponse.ok) {
            throw new Error(`Demo seed failed: ${seedResponse.status} ${JSON.stringify(seedBody)}`);
          }

          console.log(`Demo admin ready: ${email}`);
          console.log(`Demo tenant id: ${tenantId}`);
          console.log(`Demo seed: ${JSON.stringify(seedBody)}`);
          NODE
