name: Seed Demo Data

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: dd181562-df73-4a1d-b4d6-c9f3e4c07e52
      RAILWAY_SERVICE_ID: b79d9602-745f-46d1-8dfb-cb448feab202
      RAILWAY_ENVIRONMENT: production
      DEMO_LOGIN_EMAIL: demo@daoteng.demo
      DEMO_LOGIN_PASSWORD: "000000"
      API_BASE_URL: https://hr-production-994f.up.railway.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Seed richer demo data
        run: |
          set -euo pipefail
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT"
          railway variables --json > /tmp/hr-railway-vars.json
          chmod 600 /tmp/hr-railway-vars.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const vars = JSON.parse(fs.readFileSync("/tmp/hr-railway-vars.json", "utf8"));
          const supabaseUrl = vars.SUPABASE_URL;
          const anonKey = vars.SUPABASE_ANON_KEY;
          const apiBaseUrl = process.env.API_BASE_URL;
          const email = process.env.DEMO_LOGIN_EMAIL;
          const password = process.env.DEMO_LOGIN_PASSWORD;

          if (!supabaseUrl || !anonKey) throw new Error("Missing Supabase public variables");
          if (!apiBaseUrl || !email || !password) throw new Error("Missing demo seed configuration");

          const signInResponse = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
            method: "POST",
            headers: {
              apikey: anonKey,
              authorization: `Bearer ${anonKey}`,
              "content-type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });
          const signIn = await signInResponse.json().catch(() => ({}));
          if (!signInResponse.ok || !signIn.access_token) {
            throw new Error(`Demo sign-in failed: ${signInResponse.status} ${JSON.stringify(signIn)}`);
          }

          const seedResponse = await fetch(`${apiBaseUrl}/demo/seed`, {
            method: "POST",
            headers: {
              authorization: `Bearer ${signIn.access_token}`,
              "content-type": "application/json",
            },
          });
          const seed = await seedResponse.json().catch(() => ({}));
          if (!seedResponse.ok) {
            throw new Error(`Demo seed failed: ${seedResponse.status} ${JSON.stringify(seed)}`);
          }

          console.log(`Demo seed complete: ${JSON.stringify(seed)}`);
          NODE
