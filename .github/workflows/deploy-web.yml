name: Deploy Web to Vercel

# Deploys apps/web to Vercel via the CLI (works with a PRIVATE repo, unlike
# Vercel's native Git integration which needs a Pro plan for private org repos).
# Uses the prebuilt flow (pull settings -> build on the runner -> deploy
# --prebuilt) so the Next.js framework is detected correctly. The plain
# `vercel deploy` remote build mis-detected the monorepo as a static site
# ("No Output Directory named public").
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Build & Deploy to Vercel (production, prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
