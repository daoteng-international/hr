# Supabase free-tier projects pause after ~7 days without activity, which
# takes the whole demo down (login shows "Failed to fetch"). Querying the
# database every 3 days counts as activity and keeps the project awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 1 */3 * *" # 01:00 UTC (09:00 Taipei), every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/tenants?select=id&limit=1")
          echo "Supabase REST responded HTTP $status"
          # Fail loudly so a paused or broken project shows up as a red run.
          test "$status" = "200"
